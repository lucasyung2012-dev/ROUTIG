name: CI e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      # --pretty false: o formato simples vira anotação com arquivo e linha no GitHub.
      - name: Checar tipos (TypeScript)
        run: npx tsc -b --pretty false

      - name: Testes
        if: success() || failure()
        run: npx vitest run --reporter=default --reporter=github-actions

      - name: Ícones do app (a partir do logo oficial)
        run: node scripts/icons.mjs

      - name: Build de produção
        run: npx vite build

      - name: Guardar o site para publicação
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
